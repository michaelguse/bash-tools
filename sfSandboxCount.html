function niceTicks(mx){

  const coords=data.map(d=>`${xS(d.t).toFixed(1)},${yS(d.c).toFixed(1)}`);
  const base=(MT+PH).toFixed(1);
  const areaD=`M${coords[0]} ${coords.slice(1).map(p=>'L'+p).join(' ')} L${xS(data[data.length-1].t).toFixed(1)},${base} L${xS(data[0].t).toFixed(1)},${base} Z`;
  const lineD=`M${coords[0]} ${coords.slice(1).map(p=>'L'+p).join(' ')}`;

  // year tick positions (start-of-year marks between tMin and tMax)
  const years=[];
  const yStart=new Date(tMin).getFullYear()+1;
  const yEnd=new Date(tMax).getFullYear();
  for(let y=yStart;y<=yEnd;y++){
    const ms=new Date(y,0,1).getTime();
    if(ms>tMin&&ms<tMax)years.push({y,x:xS(ms)});
  }

  const panel=document.createElement('div');
  panel.className='panel';

  const titleEl=document.createElement('div');
  titleEl.className='p-title';
  titleEl.textContent=cloud.replace(/_/g,' ');
  panel.appendChild(titleEl);

  const latest=data[data.length-1];
  const latestEl=document.createElement('div');
  latestEl.className='p-latest';
  latestEl.textContent=latest.c.toLocaleString();
  const dspan=document.createElement('span');
  dspan.className='p-date';
  dspan.textContent=new Date(latest.t).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
  latestEl.appendChild(dspan);
  panel.appendChild(latestEl);

  // chart
  const chartDiv=document.createElement('div');
  chartDiv.className='chart-view';

  const svg=svgEl('svg',{viewBox:`0 0 ${VW} ${VH}`});
  svg.style.width='100%';

  // gridlines
  ticks.forEach(v=>{
    if(v>0&&v<=yMax)
      svgEl('line',{x1:ML,x2:ML+PW,y1:yS(v).toFixed(1),y2:yS(v).toFixed(1),stroke:'var(--gridline)','stroke-width':1},svg);
  });
  // baseline
  svgEl('line',{x1:ML,x2:ML+PW,y1:MT+PH,y2:MT+PH,stroke:'var(--baseline)','stroke-width':1},svg);
  // area
  svgEl('path',{d:areaD,fill:'var(--series-wash)'},svg);
  // line
  svgEl('path',{d:lineD,fill:'none',stroke:'var(--series-1)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);

  // y-axis labels
  ticks.forEach(v=>{
    const t=svgEl('text',{x:ML-4,y:(yS(v)+4).toFixed(1),'text-anchor':'end','font-size':10,fill:'var(--text-muted)','font-variant-numeric':'tabular-nums'},svg);
    t.textContent=fmt(v);
  });

  // x-axis year marks
  years.forEach(({y,x})=>{
    svgEl('line',{x1:x.toFixed(1),x2:x.toFixed(1),y1:MT+PH,y2:MT+PH+4,stroke:'var(--baseline)','stroke-width':1},svg);
    const t=svgEl('text',{x:x.toFixed(1),y:MT+PH+15,'text-anchor':'middle','font-size':10,fill:'var(--text-muted)'},svg);
    t.textContent=y;
  });

  // crosshair + dot (hidden until hover)
  const xhair=svgEl('line',{x1:0,x2:0,y1:MT,y2:MT+PH,stroke:'var(--text-muted)','stroke-width':1},svg);
  xhair.style.display='none';
  const dot=svgEl('circle',{r:4,fill:'var(--series-1)',stroke:'var(--surface-1)','stroke-width':2},svg);
  dot.style.display='none';

  // transparent hit overlay
  const overlay=svgEl('rect',{x:ML,y:MT,width:PW,height:PH,fill:'transparent'},svg);
  overlay.style.cursor='crosshair';

  const tip=document.getElementById('tip');

  overlay.addEventListener('mousemove',e=>{
    const rect=svg.getBoundingClientRect();
    const scale=VW/rect.width;
    const px=Math.max(0,Math.min(PW,(e.clientX-rect.left)*scale-ML));
    const tgt=tMin+(px/PW)*(tMax-tMin);

    // bisect to nearest point
    let lo=0,hi=data.length-1;
    while(lo<hi){const mid=(lo+hi)>>1;if(data[mid].t<tgt)lo=mid+1;else hi=mid;}
    if(lo>0&&Math.abs(data[lo-1].t-tgt)<Math.abs(data[lo].t-tgt))lo--;
    const d=data[lo];

    const cx=xS(d.t),cy=yS(d.c);
    xhair.setAttribute('x1',cx);xhair.setAttribute('x2',cx);xhair.style.display='';
    dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.style.display='';

    // tooltip — textContent only, no innerHTML
    tip.textContent='';
    const strong=document.createElement('strong');
    strong.style.fontSize='14px';
    strong.textContent=d.c.toLocaleString();
    const nameSpan=document.createElement('span');
    nameSpan.style.color='var(--text-secondary)';
    nameSpan.textContent=' '+cloud.replace(/_/g,' ');
    const br=document.createElement('br');
    const dateSpan=document.createElement('span');
    dateSpan.style.color='var(--text-muted)';
    dateSpan.textContent=new Date(d.t).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
    tip.appendChild(strong);tip.appendChild(nameSpan);tip.appendChild(br);tip.appendChild(dateSpan);

    const leftPos=e.clientX+14+160>window.innerWidth?e.clientX-170:e.clientX+14;
    tip.style.display='block';
    tip.style.left=leftPos+'px';
    tip.style.top=(e.clientY-40)+'px';
  });

  overlay.addEventListener('mouseleave',()=>{
    xhair.style.display='none';
    dot.style.display='none';
    tip.style.display='none';
  });

  chartDiv.appendChild(svg);
  panel.appendChild(chartDiv);

  // table view
  const tableDiv=document.createElement('div');
  tableDiv.className='table-view';
  const scroll=document.createElement('div');
  scroll.className='tscroll';
  const tbl=document.createElement('table');
  const thead=document.createElement('thead');
  const hrow=document.createElement('tr');
  ['Date','Count'].forEach(h=>{const th=document.createElement('th');th.textContent=h;hrow.appendChild(th);});
  thead.appendChild(hrow);tbl.appendChild(thead);
  const tbody=document.createElement('tbody');
  [...data].reverse().forEach(d=>{
    const tr=document.createElement('tr');
    const td1=document.createElement('td');
    td1.textContent=new Date(d.t).toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const td2=document.createElement('td');
    td2.textContent=d.c.toLocaleString();
    tr.appendChild(td1);tr.appendChild(td2);tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);scroll.appendChild(tbl);tableDiv.appendChild(scroll);
  panel.appendChild(tableDiv);

  return panel;
}

// ---- main ----
const allTs=Object.values(CLOUD_DATA).flat().map(p=>p[0]);
const tMin=Math.min(...allTs),tMax=Math.max(...allTs);

const grid=document.getElementById('grid');
Object.keys(CLOUD_DATA).sort((a,b)=>{
  const latestCount=c=>CLOUD_DATA[c][CLOUD_DATA[c].length-1][1];
  return latestCount(b)-latestCount(a);
}).forEach(cloud=>{
  grid.appendChild(buildPanel(cloud,CLOUD_DATA[cloud],tMin,tMax));
});

let tblMode=false;
document.getElementById('btn-tbl').addEventListener('click',()=>{
  tblMode=!tblMode;
  document.querySelectorAll('.chart-view').forEach(e=>e.classList.toggle('off',tblMode));
  document.querySelectorAll('.table-view').forEach(e=>e.classList.toggle('on',tblMode));
  document.getElementById('btn-tbl').textContent=tblMode?'Show chart view':'Show table view';
});

let dark=false;
document.getElementById('btn-drk').addEventListener('click',()=>{
  dark=!dark;
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  document.getElementById('btn-drk').textContent=dark?'Light mode':'Dark mode';
});
</script>
</body>
</html>
